# Builds the dataset on GitHub's computers, which can reach every data source.
# Start it from the Actions tab ("Run workflow"). Each stage saves its result in
# data/interim/ and commits it back to the branch it ran on, so a rerun only
# redoes the stages that are missing (tick "force" to redo everything).
name: Build dataset

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every stage, even ones already saved"
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE: ${{ inputs.force && '--force' || '' }}

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pipeline.boundaries $FORCE
      - uses: actions/upload-artifact@v4
        with: {name: interim-boundaries, path: data/interim}

  lights:
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        year: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: interim-boundaries, path: data/interim}
      - run: python -m pipeline.lights --year ${{ matrix.year }} $FORCE
        env:
          BLACKMARBLE_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: {name: "interim-lights-${{ matrix.year }}", path: data/interim}

  conflict:
    needs: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: interim-boundaries, path: data/interim}
      - run: python -m pipeline.conflict $FORCE
      - uses: actions/upload-artifact@v4
        with: {name: interim-conflict, path: data/interim}

  rain:
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: interim-boundaries, path: data/interim}
      - run: python -m pipeline.rain $FORCE
      - uses: actions/upload-artifact@v4
        with: {name: interim-rain, path: data/interim}

  population:
    needs: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: interim-boundaries, path: data/interim}
      - run: python -m pipeline.population $FORCE
      - uses: actions/upload-artifact@v4
        with: {name: interim-population, path: data/interim}

  # Saves whatever the stages produced, even if some failed, then builds the
  # dataset if every stage succeeded.
  save:
    needs: [boundaries, lights, conflict, rain, population]
    if: always() && needs.boundaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: "interim-*", path: data/interim, merge-multiple: true}
      - name: Build the dataset
        id: build
        if: >-
          needs.lights.result == 'success' && needs.conflict.result == 'success' &&
          needs.rain.result == 'success' && needs.population.result == 'success'
        run: |
          python -m pipeline.build
          pytest -q
      - name: Commit the results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add data/interim data/processed
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Dataset build: run ${{ github.run_number }}"
            git push
          fi
