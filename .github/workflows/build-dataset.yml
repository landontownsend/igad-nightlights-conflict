# Builds the dataset from the results already saved in data/interim/ and commits it.
# This job is small (about one minute). The large downloads (night lights and
# rainfall) do not run on GitHub Actions: they run in the Colab notebook
# notebooks/process_lights_colab.ipynb, and their results are committed to data/interim/.
name: Build dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Build the dataset and run the tests
        run: |
          python -m pipeline.build
          pytest -q
      - name: Commit the dataset to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Dataset build: run ${{ github.run_number }}"
            git push
          fi
