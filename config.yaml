# =============================================================================
# config.yaml
# Every setting for the project in one place: the study period, the countries,
# the data sources, the definitions of each variable, and the file paths.
# =============================================================================

# -----------------------------------------------------------------------------
# Study period
# The dataset covers January 2015 to December 2025. Night lights start three
# years earlier (2012) so that every month has a "usual level" to compare with.
# -----------------------------------------------------------------------------
years:
  start: 2015
  end: 2025
  lights_start: 2012       # first year of Black Marble data used
  prewar_light: [2012, 2014]   # years averaged for prewar_light

# -----------------------------------------------------------------------------
# The seven IGAD members in the study (Eritrea is set aside: very little data)
# ucdp_names: how UCDP spells each country
# -----------------------------------------------------------------------------
countries:
  - {iso3: SDN, name: Sudan,       ucdp_names: [Sudan]}
  - {iso3: SSD, name: South Sudan, ucdp_names: [South Sudan]}
  - {iso3: ETH, name: Ethiopia,    ucdp_names: [Ethiopia]}
  - {iso3: SOM, name: Somalia,     ucdp_names: [Somalia]}
  - {iso3: KEN, name: Kenya,       ucdp_names: [Kenya]}
  - {iso3: UGA, name: Uganda,      ucdp_names: [Uganda]}
  - {iso3: DJI, name: Djibouti,    ucdp_names: [Djibouti]}

# -----------------------------------------------------------------------------
# Data sources
# -----------------------------------------------------------------------------
sources:
  boundaries:
    # geoBoundaries open release; ADM2 = second-level areas (localities,
    # districts, zones). Falls back to ADM1 for a country without ADM2.
    api: https://www.geoboundaries.org/api/current/gbOpen
    level: ADM2
  black_marble:
    product: VNP46A3                          # monthly composite
    variable: NearNadir_Composite_Snow_Free   # radiance, nW/cm2/sr
    drop_quality_flags: [2, 255]   # 2 = filled in from past years, 255 = no data
    min_valid_share: 0.5           # a month counts only if half the locality has a clear reading
    # Pixels at or above this brightness count as lit (lit_sum). Black Marble already sets
    # most unlit background to zero, so this changes the totals very little.
    lit_threshold: 0.5             # nW/cm2/sr
    lit_threshold_strict: 2.0      # nW/cm2/sr, saved in lit2_sum for later checks
  ucdp:
    downloads_page: https://ucdp.uu.se/downloads/index.html
    max_location_precision: 3      # keep events placed at least to a second-level area
  chirps:
    url: https://data.chc.ucsb.edu/products/CHIRPS-2.0/africa_monthly/tifs/chirps-v2.0.{year}.{month:02d}.tif.gz
    normal_years: [1991, 2020]     # the "normal" rainfall each month is compared with
  worldpop:
    url: https://data.worldpop.org/GIS/Population/Global_2000_2020_1km/{year}/{ISO}/{iso}_ppp_{year}_1km_Aggregated.tif
    last_year: 2020                # later years reuse the 2020 estimate

# -----------------------------------------------------------------------------
# Variable definitions
# -----------------------------------------------------------------------------
definitions:
  outbreak_deaths: 25          # battle deaths in a month that count as an outbreak
  peaceful_months: 12          # months with no battle deaths needed before an outbreak
  battle_violence_types: [1, 2]   # UCDP: 1 state-based, 2 non-state (3 = one-sided, not battles)
  sudden_drop_share: 0.5       # sudden_drop = light under half its usual level (3-month median)
  usual_level_years: 3         # "usual level" = same calendar month, previous 3 years
  months_since_cap: 60         # months_since_violence stops counting at 60
  light_constant: 10           # added to light before taking log ratios, so that tiny
                               # changes in dark localities stay near zero

# -----------------------------------------------------------------------------
# File paths
# -----------------------------------------------------------------------------
paths:
  interim: data/interim
  processed: data/processed
  downloads: downloads         # large raw files; never committed
